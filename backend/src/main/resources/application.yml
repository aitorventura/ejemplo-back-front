spring:
  application:
    name: videojuegos-api
  datasource:
    url: jdbc:postgresql://localhost:5433/videojuegos_db
    username: videojuegos_user
    password: password123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  # 0.0.0.0 = escucha en todas las interfaces de red, no solo en localhost.
  # Hace falta si pruebas la app en un móvil físico conectado a la misma wifi.
  address: 0.0.0.0
  port: 8080

springdoc:
  swagger-ui:
    path: /documentacion
    operations-sorter: method
